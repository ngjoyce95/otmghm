    // Gestation period calculation helper
    function calculatePOG(lmpDateStr, targetDateStr) {
      if (!lmpDateStr) return 'N/A';
      const lmp = new Date(lmpDateStr);
      const target = targetDateStr ? new Date(targetDateStr) : new Date();
      if (isNaN(lmp.getTime()) || isNaN(target.getTime())) return 'N/A';

      const diffTime = target.getTime() - lmp.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 3600 * 24));
      if (diffDays < 0) return 'Pre-conception';
      const weeks = Math.floor(diffDays / 7);
      const days = diffDays % 7;
      return `${weeks}w + ${days}d`;
    }

    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function getDayName(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      return DAYS_OF_WEEK[d.getDay()] || '';
    }

    // Auto calculate age from Malaysian IC number
    function estimateAgeFromIC(icStr) {
      if (!icStr || typeof icStr !== 'string') return '';
      const clean = icStr.replace(/\D/g, '');
      if (clean.length < 6) return '';
      const yearPrefix = parseInt(clean.substring(0, 2), 10);
      if (isNaN(yearPrefix)) return '';
      const currentYear = 2026;
      const fullYear = yearPrefix <= 26 ? 2000 + yearPrefix : 1900 + yearPrefix;
      const age = currentYear - fullYear;
      return age > 0 && age < 110 ? `${age} yrs` : '';
    }

        e.preventDefault();
        if (!patientForm.name.trim() || !patientForm.icNumber.trim()) {

        const opDateToSave = patientForm.opDate || selectedDate;

        // Block adding new patients or moving existing patients onto a locked date
        if (blockedCheck) {
          if (!editingPatient || editingPatient.opDate !== opDateToSave || editingPatient.hospital !== patientForm.hospital) {
            showToast(`Date ${opDateToSave} is locked for ${patientForm.hospital} (${blockedCheck.reason}). No patients can be added or rescheduled to this locked date.`, 'warning');

        const timeNow = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

        let finalIssues = Array.isArray(patientForm.antenatalIssues) ? [...patientForm.antenatalIssues] : [];
        if (patientForm.customAntenatalIssue && patientForm.customAntenatalIssue.trim()) {
          if (!finalIssues.includes(patientForm.customAntenatalIssue.trim())) {

        const calculatedAge = patientForm.age?.trim() || estimateAgeFromIC(patientForm.icNumber) || '-';

          age: calculatedAge,
          antenatalIssues: finalIssues,
          opDate: opDateToSave,
          pog: calculatePOG(patientForm.lmp, opDateToSave),
          lastEditedBy: currentUser.name,
          lastEditedRole: currentUser.role,
          lastEditedAt: timeNow

          recordAuditLog('ADDED_PATIENT', payload.name, opDateToSave, `Booked ${payload.opType} at ${payload.hospital}.`);

        const index = dayCases.findIndex(p => p.id === patientId);
        if (index === -1) return;

        if (direction === 'up' && index > 0) {
          const tempSeq = dayCases[index].sequence || index + 1;
          const targetSeq = dayCases[index - 1].sequence || index;
          dayCases[index].sequence = targetSeq;
          dayCases[index - 1].sequence = tempSeq;
        } else if (direction === 'down' && index < dayCases.length - 1) {
          const tempSeq = dayCases[index].sequence || index + 1;
          const targetSeq = dayCases[index + 1].sequence || index + 2;
          dayCases[index].sequence = targetSeq;
          dayCases[index + 1].sequence = tempSeq;
        }

        setPatients(prev => {
          const updatedMap = new Map(dayCases.map(item => [item.id, item.sequence]));
          return prev.map(p => (updatedMap.has(p.id) ? { ...p, sequence: updatedMap.get(p.id) } : p));
        });
        showToast('Operating sequence reordered.', 'info');
      };

      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();

      const prevMonth = () => {
        if (currentMonth === 0) { setCurrentMonth(11); setCurrentYear(y => y - 1); }
        else { setCurrentMonth(m => m - 1); }
      };

      const nextMonth = () => {
        if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(y => y + 1); }
        else { setCurrentMonth(m => m + 1); }
      };

      const filteredPatients = useMemo(() => {
        return patients.filter(p => {
          const matchesHospital = hospitalFilter === 'ALL' || p.hospital === hospitalFilter;
          const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.icNumber.includes(searchQuery) ||
            (p.surgeon && p.surgeon.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesOp = filterOpType === 'ALL' || p.opType === filterOpType;
          return matchesHospital && matchesSearch && matchesOp;
        });
      }, [patients, hospitalFilter, searchQuery, filterOpType]);

      const selectedDatePatients = useMemo(() => {
        return patients
          .filter(p => p.opDate === selectedDate && (hospitalFilter === 'ALL' || p.hospital === hospitalFilter))
          .sort((a, b) => (a.sequence || 1) - (b.sequence || 1));
      }, [patients, selectedDate, hospitalFilter]);

      const isCurrentSelectedDateBlocked = useMemo(() => {
        return isDateBlockedForHospital(selectedDate, hospitalFilter === 'ALL' ? 'OTM' : hospitalFilter);
      }, [selectedDate, blockedDates, hospitalFilter]);

                    className="w-full h-full"

                <div className="flex items-center justify-center gap-2">
                  <button

                    onClick={triggerLogoFileInput}

                      onClick={resetToDefaultLogo}

                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-purple-50 text-purple-900 border border-purple-200">
                  <i className="fa-solid fa-hospital text-xs text-purple-700"></i>
                  <span>Jabatan O&amp;G Hospital Melaka</span>
                </div>
              </div>

              {loginError && (

                  <i className="fa-solid fa-circle-exclamation text-rose-500"></i>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Password</label>

                >
                  <i className="fa-solid fa-plus"></i>
                  <span>Add Patient</span>
                </button>
              </div>
            </div>
          </div>

          <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex-1">
            {activeTab === 'calendar' && (

                {/* Calendar Grid */}
                <div className="lg:col-span-8 bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200 space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div className="flex items-center space-x-2">
                      <div className="w-9 h-9 rounded-xl bg-teal-100 text-teal-800 flex items-center justify-center font-bold text-sm">
                        {currentMonth + 1}
                      </div>
                      <div>
                        <h2 className="text-base sm:text-lg font-black text-slate-900">{monthNames[currentMonth]} {currentYear}</h2>
                        <p className="text-[11px] text-slate-500">Elective Operation Theatre Calendar View — OTM & GHM</p>
                      </div>
                    </div>
                    <div className="flex items-center space-x-1.5">
                      <button onClick={prevMonth} className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer">
                        <i className="fa-solid fa-chevron-left text-xs"></i>
                      </button>
                      <button onClick={() => { setCurrentMonth(9); setCurrentYear(2026); }} className="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 cursor-pointer">
                        Oct '26
                      </button>
                      <button onClick={nextMonth} className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer">
                        <i className="fa-solid fa-chevron-right text-xs"></i>
                      </button>

                  <div className="grid grid-cols-7 gap-1 text-center text-xs font-bold uppercase text-slate-500 py-1">

                  <div className="grid grid-cols-7 gap-1.5 sm:gap-2">

                      <div key={`empty-${i}`} className="min-h-[75px] sm:min-h-[85px] bg-slate-50/40 rounded-2xl border border-dashed border-slate-200/60 opacity-30" />
                    ))}
                    {Array.from({ length: daysInCurrentMonth }).map((_, i) => {
                      const dayNum = i + 1;

                      const isSelected = selectedDate === dateString;
                      const dayCases = patients.filter(p => p.opDate === dateString && (hospitalFilter === 'ALL' || p.hospital === hospitalFilter));
                      const isBlocked = isDateBlockedForHospital(dateString, hospitalFilter === 'ALL' ? 'OTM' : hospitalFilter);

                      return (
                        <div
                          key={dateString}
                          onClick={() => setSelectedDate(dateString)}
                          className={`min-h-[75px] sm:min-h-[85px] p-2 rounded-2xl border transition flex flex-col justify-between cursor-pointer select-none relative ${
                            isSelected ? 'border-teal-600 bg-teal-50/50 ring-2 ring-teal-500/30' : isBlocked ? 'bg-rose-50/70 border-rose-200' : 'bg-white border-slate-200 hover:border-slate-300'

                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Specify Other Procedure</label>
                      <input type="text" placeholder="e.g. Exploratory Laparotomy" value={patientForm.customOpType} onChange={(e) => setPatientForm({ ...patientForm, customOpType: e.target.value })} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs" required />
                    </div>
                  )}

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Case Booked By</label>
                      <input type="text" placeholder="e.g. Dr. Sarah (MO)" value={patientForm.surgeon} onChange={(e) => setPatientForm({ ...patientForm, surgeon: e.target.value })} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Anesthesia</label>
                      <select value={patientForm.anesthesia} onChange={(e) => setPatientForm({ ...patientForm, anesthesia: e.target.value })} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs">
                        <option value="Spinal Anesthesia">Spinal Anesthesia</option>
                        <option value="General Anesthesia (GA)">General Anesthesia (GA)</option>
                        <option value="Epidural Anesthesia">Epidural Anesthesia</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">OT Room</label>
                      <input type="text" value={patientForm.otRoom} onChange={(e) => setPatientForm({ ...patientForm, otRoom: e.target.value })} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs" />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Additional Remarks</label>
                    <input type="text" placeholder="e.g. NPO midnight, standby ICU bed..." value={patientForm.remarks} onChange={(e) => setPatientForm({ ...patientForm, remarks: e.target.value })} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs" />
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                    <button type="button" onClick={() => setIsPatientModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold cursor-pointer">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold shadow-md shadow-teal-500/20 cursor-pointer">Save Patient Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isBlockModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 border border-slate-200 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center font-bold">
                      <i className="fa-solid fa-lock"></i>
                    </div>
                    <h3 className="text-base font-extrabold text-slate-900">{isCurrentSelectedDateBlocked ? 'Unlock Surgery Date' : 'Lock Surgery Date'}</h3>
                  </div>
                  <button onClick={() => setIsBlockModalOpen(false)} className="text-slate-400 hover:text-slate-600 cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <form onSubmit={handleToggleBlockDate} className="space-y-4 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Selected Date</label>
                    <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Hospital Facility</label>
                    <select value={blockHospital} onChange={(e) => setBlockHospital(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold">
                      <option value="OTM">OTM Only</option>
                      <option value="GHM">GHM Only</option>
                      <option value="ALL">All Hospitals (OTM & GHM)</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Lock Reason</label>
                    <input type="text" value={blockReason} onChange={(e) => setBlockReason(e.target.value)} placeholder="e.g. OT Maintenance / Public Holiday" className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs" required />
                  </div>
                  <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                    <button type="button" onClick={() => setIsBlockModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold cursor-pointer">Cancel</button>
                    <button type="submit" className={`px-5 py-2 rounded-xl text-white font-bold shadow-md cursor-pointer ${isCurrentSelectedDateBlocked ? 'bg-rose-600 hover:bg-rose-700' : 'bg-amber-600 hover:bg-amber-700'}`}>
                      {isCurrentSelectedDateBlocked ? 'Unlock Now' : 'Confirm Lock Date'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isDeleteConfirmOpen && patientToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 border border-slate-200 space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-xl">
                  <i className="fa-solid fa-trash-can"></i>
                </div>
                <div className="text-center space-y-1">
                  <h3 className="text-base font-extrabold text-slate-900">Confirm Deletion</h3>
                  <p className="text-xs text-slate-500">Are you sure you want to delete the record for <strong>{patientToDelete.name}</strong> ({patientToDelete.opType})?</p>
                </div>
                <div className="flex items-center justify-center gap-2 pt-2">
                  <button onClick={() => { setIsDeleteConfirmOpen(false); setPatientToDelete(null); }} className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-xs font-semibold cursor-pointer">Cancel</button>
                  <button onClick={confirmDeletePatient} className="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow-md shadow-rose-600/20 cursor-pointer">Delete Record</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
